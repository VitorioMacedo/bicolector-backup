[project]
name = "bic"
version = "0.1.0"
description = "Coletor Modbus para medidores Schneider PM2230 -> SQL Server -> Power BI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymodbus>=3.9",
    "sqlalchemy[asyncio]>=2.0.23",
    "aioodbc>=0.5",
    "pyodbc>=5.1",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
